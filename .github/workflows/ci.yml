# ─────────────────────────────────────────────────────────────────────────────
# CI
#
# Everything that must be true before code merges. The previous estate had four
# workflows, all added after incidents, none covering typecheck, lint,
# migrations, secrets or dependencies. This runs before the first feature.
#
# Note what is NOT here: a deploy job. Deployment is configured when staging
# exists (ADR 0007). Until then there is nowhere to deploy to, and a deploy job
# that silently does nothing is worse than an absent one.
# ─────────────────────────────────────────────────────────────────────────────
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks/gitleaks-action@v2 reads the PR's commits via the GitHub API on
  # pull_request events; without this it fails with HTTP 403 "Resource not
  # accessible by integration". Read-only, no write scope added.
  pull-requests: read

jobs:
  # ── The five invariants (ADR 0003, 0008, 0015, and scripts/invariants) ─────
  # First, and fastest. If money is not integer kobo or a table is missing RLS,
  # nothing else about this change matters yet.
  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/invariants/run-all.mjs --verbose

  typecheck-and-test:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ── Database: migrations apply cleanly, and pgTAP passes ──────────────────
  # Runs against a real local Postgres started by the Supabase CLI, not a mock.
  # RLS that is not tested against an actual role is not tested.
  database:
    name: migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: config.toml is authored against CLI 2.109.x. `latest`
          # installs a newer CLI that cannot parse it (CliConfigParseError).
          version: 2.109.1

      - name: Start the local stack
        run: supabase start

      # `db reset` replays every migration from scratch and then applies the
      # seed. A migration that only works against an already-migrated database
      # fails here, which is the point: the previous system's 52 committed
      # migrations had ZERO versions in common with the 38 applied in
      # production, because nothing ever replayed them.
      - name: Apply every migration from scratch
        run: supabase db reset --debug

      - name: pgTAP
        run: supabase test db

      # A migration must leave no drift: what the files say and what the
      # database contains have to agree, or the repository is describing
      # something other than the schema.
      - name: Assert no schema drift
        run: |
          supabase db diff --schema public,app,private > /tmp/drift.sql
          if [ -s /tmp/drift.sql ]; then
            echo "Schema drift detected — the migrations do not reproduce the schema:"
            cat /tmp/drift.sql
            exit 1
          fi
          echo "No drift."

  # ── Secrets and dependencies (SEC-30) ─────────────────────────────────────
  security:
    name: secret and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A belt-and-braces check for the specific mistake that has already
      # happened here: `.env` was committed to kolekto-fe-old twice, and
      # `supabase/.temp/linked-project.json` pointed a fresh clone at production
      # for three weeks.
      - name: Assert no environment or link files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)|supabase/\.temp/' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "These files must never be tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "No environment or CLI link files tracked."

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `npm audit --audit-level=high`, plus the written exceptions in
      # docs/security/dependency-audit-exceptions.md.
      - name: Dependency audit
        run: node scripts/security/audit.mjs

  # ── Browser E2E (M13.1 FINAL-2, QA-ENV-01) ────────────────────────────────
  # The existing Playwright suite driven through a real Chromium against the
  # full local stack. It exists because the suite cannot run reliably on the
  # resource-constrained Windows dev box (QA-ENV-01): signup+OTP succeed but the
  # post-verify onboarding sequence stalls under load. ubuntu-latest runs the
  # same `supabase start` the `database` job already proves, with CPU/RAM to
  # spare, so a green run here establishes that the stall is environmental.
  #
  # Additive and self-contained: local stack only (env.ts loopback guard refuses
  # anything else), no hosted/production credentials, no deploy, no DB reset.
  # This job is NOT yet wired into branch protection, so its result is reported
  # honestly (red on failure) without blocking merges until it has proven green.
  # See docs/product/M13.1-CI-E2E-IMPLEMENTATION-REPORT.md.
  #
  # Split in two with Playwright's own `--shard`, one runner each, so every
  # shard has its own local stack, worker, build and browser — nothing is
  # shared between them. The full suite took 24 minutes of a 30-minute job.
  # Playwright assigns every test to exactly one shard; locally,
  # `npm run test:e2e -- --shard=1/2` reproduces one shard exactly.
  e2e:
    name: browser e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both shards always finish, so one failing never hides the other's result.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Static, non-secret local values. The dynamic keys and the ephemeral
      # session secret are written to $GITHUB_ENV by the steps below so they
      # reach every later step — including the `next build` Playwright runs,
      # where the NEXT_PUBLIC_* values must be present to be inlined.
      KOLEKTO_ENV: local
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      MAILPIT_URL: http://127.0.0.1:54324
      # KOLEKTO_PRODUCTION_PROJECT_REF / KOLEKTO_EXPECTED_PROJECT_REF are left
      # unset on purpose: for KOLEKTO_ENV=local the config guards require a
      # loopback URL and no hosted ref.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: config.toml is authored against CLI 2.109.x. `latest`
          # installs a newer CLI that cannot parse it (CliConfigParseError).
          version: 2.109.1

      - name: Start the local stack
        run: supabase start

      # Map the CLI's key names onto the names the app requires. The CLI output
      # name is not assumed: a publishable key is preferred when present and the
      # legacy anon key is the fallback; likewise service_role then secret. If
      # neither is found the step fails loudly rather than letting the app start
      # with an empty key. (`supabase status -o env --override-name` is the
      # documented alternative but ties us to the CLI's internal key spelling.)
      - name: Export local Supabase keys to the environment
        run: |
          supabase status -o env > supabase-status.env
          read_key() { grep -E "^$1=" supabase-status.env | head -n1 | cut -d'=' -f2- | sed -e 's/^"//' -e 's/"$//'; }
          publishable="$(read_key PUBLISHABLE_KEY)"
          anon="$(read_key ANON_KEY)"
          service="$(read_key SERVICE_ROLE_KEY)"
          secret="$(read_key SECRET_KEY)"
          client_key="${publishable:-$anon}"
          service_key="${service:-$secret}"
          if [ -z "$client_key" ] || [ -z "$service_key" ]; then
            echo "::error::Could not extract Supabase keys from 'supabase status -o env'. Output was:"
            cat supabase-status.env
            exit 1
          fi
          echo "::add-mask::$client_key"
          echo "::add-mask::$service_key"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$client_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
          rm -f supabase-status.env

      # The contributor-cookie signing secret (>=32 chars). Generated per run and
      # never persisted — it only has to be present and long enough for the app
      # to start (packages/config/src/env.ts loadSessionSecret).
      - name: Generate an ephemeral session secret
        run: |
          secret="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$secret"
          echo "KOLEKTO_SESSION_SECRET=$secret" >> "$GITHUB_ENV"

      - run: npm ci

      # Build the composite workspace packages before Playwright's webServer
      # runs `next build`. apps/web type-checks as a composite project with
      # project references (packages/{domain,config,validation,db,ui,adapters});
      # a bare `next build` needs those references' build outputs
      # (packages/*/dist/*.d.ts) to already exist. On a fresh runner they do
      # not — dist is gitignored and the packages are consumed as source with
      # no build step — so `next build` fails type checking with TS6305. The
      # typecheck-and-test job builds these via `tsc --build`; this job, which
      # never ran it, must do the same before next build. (This is why the
      # suite could not even start: the webServer's build exited 1.)
      - name: Build workspace project references
        run: npm run typecheck

      - name: Install Chromium and its Linux system dependencies
        run: npx playwright install --with-deps chromium

      # The production worker, built and run exactly as it ships: esbuild bundle,
      # plain Node, no tsx. It idles against an empty queue for the existing
      # suite (no notification spec yet) but completes the real runtime so the
      # environment matches what the later notification spec will need.
      - name: Build the notification worker
        run: npm run build --workspace apps/worker

      - name: Start the notification worker in the background
        run: |
          nohup node apps/worker/dist/index.js > worker.log 2>&1 &
          echo $! > worker.pid
          echo "Worker started (PID $(cat worker.pid))."

      # Playwright owns the web server: its webServer block runs
      # `npm run build --workspace apps/web && npm run start ... -p 3010` with
      # NEXT_DIST_DIR=.next-e2e. We do not duplicate that here.
      - name: Run the Playwright E2E suite
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      # Artifact names must be unique per run, so each shard names its own.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-log-shard-${{ matrix.shard }}
          path: worker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the worker
        if: always()
        run: |
          if [ -f worker.pid ]; then
            kill "$(cat worker.pid)" 2>/dev/null || true
          fi

      - name: Stop the local stack
        if: always()
        run: supabase stop || true

  # One result for the whole suite under the job's original check name, green
  # only when every shard passed.
  e2e-result:
    name: browser e2e
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Require every shard to pass
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Browser E2E shards did not all pass (result: ${{ needs.e2e.result }})."
            exit 1
          fi
          echo "Both shards passed."
