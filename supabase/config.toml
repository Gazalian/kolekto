# ─────────────────────────────────────────────────────────────────────────────
# Supabase local configuration
#
# ADR 0007. This file describes the LOCAL stack only. No cloud project is
# referenced here, and `supabase/.temp/` is git-ignored, so a fresh clone can
# never be pointed at a remote project by accident — which is exactly what
# happened in the previous backend between 2026-08-06 and 2026-08-31.
#
# `major_version` is pinned deliberately. The previous estate ran Postgres 15.8
# in production and 17.4.1 in test, in different regions, so testing against
# "test" proved very little. Local, staging and production run the same major
# version or the difference is a known, written-down risk.
# ─────────────────────────────────────────────────────────────────────────────

project_id = "kolekto"

[api]
enabled = true
port = 54321
# PostgREST serves `public` only. `app` and `private` hold the helper functions
# and operational views and are deliberately unreachable over the REST API,
# whatever their grants say.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local email testing. Renamed from [inbucket] in CLI 2.108.0 — the service is
# Mailpit now, not InBucket. The old section still parses but warns.
[local_smtp]
enabled = true
# The Mailpit web interface and API.
port = 54324
# M13.2: publish Mailpit's SMTP listener on the host, so the app's Mailpit email
# adapter (EMAIL_PROVIDER=mailpit, EMAIL_SMTP_PORT=54325) can deliver to it. It
# only accepts mail into the catcher; nothing is relayed. Takes effect on the
# next `supabase stop` / `supabase start`.
smtp_port = 54325

[storage]
enabled = true
# PRD 3.2: a community logo is at most 2 MB; a collection cover at most 5 MB.
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://127.0.0.1:3000/auth/callback"]

# Access-token lifetime. One hour, so a token cannot outlive a handover by more
# than that; permission checks also run per request, so an ended officer term
# stops granting anything immediately regardless (HND-02).
#
# NOTE: SEC-04 also wants a 7-day session with a 12-hour idle timeout. That is
# NOT configured here — it belongs in [auth.sessions] (timebox,
# inactivity_timeout), which this file does not yet set. Left unconfigured
# deliberately rather than half-stated; raise it as its own change.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Auth model: password signup with OTP as a passwordless alternative and
# verification mechanism. The previous system was email + password only, with
# ZERO enrolled MFA factors across 623 accounts (SEC-01). The new model adds
# passwords back as the primary credential while keeping OTP for verification,
# passwordless login, and recovery.
enable_signup = true
enable_anonymous_sign_ins = false

# NIST 800-63B: minimum 8 characters, no arbitrary complexity requirements.
# Supabase/GoTrue handles hashing (bcrypt); passwords never reach public.users.
# Renamed from password_min_length in CLI 2.109.1.
minimum_password_length = 8

# SEC-04: session policy.
# timebox: absolute session lifetime regardless of activity (7 days = 604800s).
# inactivity_timeout: session expires if unused for this long (12 hours = 43200s).
[auth.sessions]
timebox = 604800
inactivity_timeout = 43200

[auth.email]
enable_signup = true
enable_confirmations = true
# The previous project had an OTP expiry over an hour, flagged by Supabase's own
# advisor. SEC-05 wants five minutes.
otp_expiry = 300
otp_length = 6
max_frequency = "60s"

# LOCAL STACK ONLY. This file configures `supabase start`; it is not what
# configures the hosted project, and nothing in this repository pushes it there
# (ADR 0007 keeps environments apart).
#
# The CLI's default allows two OTP emails per hour, which is a sensible default
# for a real project and a wall for a test suite: the E2E specs sign in as a
# fresh person per journey — three per run once Phase 3's collection journeys
# joined Phase 2's — and the third sign-in silently failed to send, so a test
# waited fifteen seconds for an email that was never going to arrive. Raised
# here rather than worked around in the tests, because sharing one signed-in
# session between specs would make them depend on each other's order.
[auth.rate_limit]
email_sent = 100

# Default templates render only a confirmation link ({{ .ConfirmationURL }}),
# not the numeric code — see supabase/templates/otp.html's own comment. Both
# mail actions signInWithOtp can trigger (a new sign-up vs. a returning user)
# are pointed at the same file so the code appears either way.
[auth.email.template.confirmation]
subject = "Your Kolekto sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Your Kolekto sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.recovery]
subject = "Reset your Kolekto password"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
# SEC-05 wants the SMS OTP to be 6 digits and expire in 5 minutes, as the email
# OTP above does. Neither is settable here. CLI 2.109.1 accepts only
# enable_signup, enable_confirmations, template, max_frequency, test_otp and the
# provider subsections under [auth.sms]; there is no SMS equivalent of
# otp_expiry or otp_length anywhere in config.toml. They are project-level
# settings (sms_otp_exp, sms_otp_length) applied to a hosted project, so they
# belong with the DEC-17 provider decision and the hosted-project checklist, not
# in this file.
#
# Nothing is lost locally: no SMS provider is configured, so the local stack
# sends no SMS and prints codes to the CLI log instead.
#
# MFA phone factors are the one OTP that IS configurable locally, under
# [auth.mfa.phone].

[auth.mfa]
# SEC-02: owners and treasurers must hold a second factor before adding a
# withdrawal account or withdrawing. Enrolment is enforced in the application at
# the point of the action; the factor type is enabled here.
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false

[edge_runtime]
# ADR 0005: there are no Edge Functions in this repository, and there will not
# be. Webhooks and cron targets are route handlers in apps/web, deployed by CI.
enabled = false
