<!--
  otp.html — shared by the confirmation (new sign-up) and magic-link
  (returning sign-in) mail actions, both configured in config.toml to use
  this file.

  Supabase's own default templates only render `{{ .ConfirmationURL }}`, a
  link with an opaque token_hash — no version of the numeric code
  `signInWithOtp`/`verifyOtp` actually needs. `apps/web`'s login screen reads
  "Enter the code sent to <email>" (LoginForm.tsx) and calls
  `verifyOtp({ email, token, type })` with the 6-digit code (otp_length = 6
  below), so the email has to contain `{{ .Token }}` in plain text, not just
  a link, or that screen has nothing to check against.
-->
<h2>Your Kolekto sign-in code</h2>
<p>Enter this code to continue:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 4px;">{{ .Token }}</p>
<p>This code expires in 5 minutes. If you did not request it, you can ignore this email.</p>
